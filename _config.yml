# ─────────────────────────────────────────────
#  장윤재 블로그 — Jekyll + Minimal Mistakes (글 읽기 중심 레이아웃)
#  주소: https://janggoons.github.io/blog/
#  연구 사이트(janggoons.github.io)와는 별도 저장소(janggoons/blog)입니다.
#  이 파일을 수정한 뒤에는 GitHub에 올려야 반영됩니다 (1~2분 소요).
# ─────────────────────────────────────────────

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"

# 사이트 기본 정보
locale: "ko-KR"
title: "장윤재 블로그"
masthead_title: "장윤재 블로그"
title_separator: "|"
name: "장윤재"
description: "컴퓨팅 교육 · AI 교육을 연구하고 가르치며 읽고, 준비하고, 돌아본 것을 기록합니다."
url: "https://janggoons.github.io"
baseurl: "/blog"                 # 하위 경로 사이트 — 링크는 항상 relative_url 필터 사용
repository: "janggoons/blog"
timezone: Asia/Seoul
words_per_minute: 300
date_format: "%Y.%m.%d"

# 공유 미리보기 이미지 (연구 사이트 이미지 재사용)
og_image: "https://janggoons.github.io/assets/images/og-card.png"

# 검색 (상단 돋보기)
search: true
search_full_content: true

# 댓글 — giscus 사용 시 README.md의 「댓글 켜기」 참고
comments:
  provider: false
  # provider: "giscus"
  # giscus:
  #   repo_id: ""
  #   category_name: "Comments"
  #   category_id: ""
  #   discussion_term: "pathname"
  #   reactions_enabled: "1"
  #   theme: "light"

analytics:
  provider: false

# 글쓴이 정보 (글 하단 · 공유 메타데이터에 사용, 사이드바는 표시하지 않음)
author:
  name: "장윤재"
  avatar: "https://janggoons.github.io/assets/images/profile.jpg"
  bio: "강원대학교 강릉자유전공학부 조교수 · 컴퓨팅 교육 연구자"
  links:
    - label: "연구 사이트"
      icon: "fas fa-fw fa-home"
      url: "https://janggoons.github.io/"

footer:
  links:
    - label: "연구 사이트"
      icon: "fas fa-fw fa-home"
      url: "https://janggoons.github.io/"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-7958-8040"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:janggoons@gmail.com"

# 빌드 설정
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# 첫 화면 글 목록 페이지 나누기
paginate: 10
paginate_path: /page:num/

# 카테고리 · 태그 모아보기
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# 글 · 페이지 기본값 — 사이드바 없이 본문 중심
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: reading
      author_profile: false
      read_time: true
      show_date: true
      share: false
      related: true
      comments: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      classes: reading
      author_profile: false
